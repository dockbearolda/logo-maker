# Les tests de lib/ et du serveur, à chaque PR et sur main.
# Le banc des mêmes octets (npm run banc) reste sur le poste : il tourne
# sur les logos des clients, qui ne quittent pas ~/Downloads.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'lib/*.test.mjs' serveur.test.mjs
