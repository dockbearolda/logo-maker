     relancer ce script remplace index.html, lib/ et vendor/ par ceux du

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
  :root {
    /* ------------------------------------------------------------ LA TEINTE
       CELLE D'OLDA PRINT STUDIO (11 septembre 2026). Le patron a validé la maquette
       `olda_system_prototype_v2.html` : sa structure ET son design deviennent
       ceux du comptoir. Ces jetons portent désormais ses valeurs — le fond
       gris clair, les cartes blanches à filet, l'encre bleu nuit, l'action
       bleu ciel —, et tout écran qui les lit prend son allure d'un coup. Les
       composants propres à la maquette (barre latérale, cartes chiffrées,
       tableaux, pastilles, colonnes, fenêtres) sont en bas, sous « o- ». */

    /* --------------------------------------------------------- SURFACES */
    --fond: #0e0f11;
    --carte: #17181b;
    --surface: #202125;
    --zone: #24252a;
    --survol: #24252a;
    --survol-fort: #2e2f34;
    --filet-ligne: #26272b;

    /* ------------------------------------------------------------ TEXTE */
    --encre-1: #f4f4f2;
    --encre-2: #a2a2a0;
    /* LE GRIS CLAIR NE SE LIT PAS (23 septembre 2026) : 2,6:1 sur blanc,
       loin des 4,5:1 d'un texte qu'on doit lire. Tout ce qui se lit — un
       titre de colonne, un tableau vide, une aide, un placeholder, une valeur
       de Réglages — est en --encre-2. --encre-3 ne sert plus qu'à ce qui est
       éteint ou décoratif : un bouton inactif, un chevron, un filet. */
    --encre-3: #75757a;
    --encre-indice: #a2a2a0;

    /* ----------------------------------------------------------- TRAITS */
    --filet-carte: #26272b;
    --filet-fort: #3a3b41;

    /* ------------------------------------------------------------ ACCENT
       Le bleu ciel (#0284c7) de ses boutons pleins, de ses onglets et de ses
       filtres choisis ; un bleu plus soutenu sous la souris. */
    --accent: #6f95ff;
    --accent-survol: #8eabff;
    --sur-accent: #0e0f11;

    /* ============================================ LA HIÉRARCHIE DES ACTIONS
       Les niveaux restent, sous l'allure de la maquette : bouton plein bleu
       ciel, bouton à filet, texte nu, rouge pour ce qui ne se répare pas. La
       maquette ne met aucune ombre à ses boutons. */
    --action: #0284c7;
    --action-survol: #0369a1;
    --sur-action: #fff;
    --ombre-action: 0 0 #0000;
    --ombre-action-majeure: 0 0 #0000;
    --filet-bouton: #2a2b30;
    --ombre-contour: 0 0 #0000;
    --succes: #1fa971;
    --succes-encre: #4ade80;
    /* L'AMBRE DE LA MAISON — celle des pastilles « chez le client » et des
       points qui manquent à un devis. Elle attire l'œil sans crier : ce
       n'est pas une erreur, c'est quelque chose à finir. */
    --attention-encre: #a85b00;
    /* L'ambre a besoin d'un FOND et d'un FILET dès qu'une question se pose
       dans une carte et non plus dans une phrase (22 septembre 2026, la
       prise de commande façon caisse) : « Dos · à choisir » est une carte
       ouverte, pas un point au bout d'une ligne. */
    --attention-fond: #fff7ed;
    --attention-filet: #fdba74;
    --danger: #f26b5b;
    --danger-filet: rgba(220,38,38,.35);
    --danger-voile: rgba(220,38,38,.08);
    --eteint: #f1f5f9;
    --eteint-encre: #64748b;

    /* ============================================ LE TICKET DE LA CAISSE
       LA COLONNE DU PANIER DE LA PRISE DE COMMANDE (22 septembre 2026) : ce
       qu'on va encaisser tient dans une carte claire, comme les autres —
       le fond d'une carte, ses deux filets gris, et quatre encres du bleu
       nuit au gris discret. Rien d'écrit en clair dans les styles. L'ambre
       et le vert y ont leur propre jeton, un ton plus soutenu que ceux du
       reste de l'app. */
    --ticket-fond: var(--carte);
    --ticket-filet: #e2e8f0;
    --ticket-filet-fort: #cbd5e1;
    --ticket-encre: #0f172a;
    --ticket-pale: #334155;
    --ticket-sourdine: #64748b;
    --ticket-discret: #94a3b8;
    --ticket-attention: #b45309;
    --ticket-succes: #0b7a50;
    /* Le bouton qui encaisse : bleu ciel plein, le même que l'action du
       reste de l'app. */
    --ticket-action: #0284c7;
    --ticket-sur-action: #fff;

    /* ================================== LA FENÊTRE D'UNE COMMANDE
       ELLE S'OUVRE SUR CE QUI ATTEND (maquette du 16 septembre 2026) : un
       bandeau d'ardoise qui dit le geste en une phrase, un rail d'argent à
       droite. L'ARDOISE PLUTÔT QUE LE BLEU DES BOUTONS : elle couvre une
       bande entière et non un bouton de 42 px — le bleu vif, à cette
       surface, fait un bloc. C'est le seul endroit de l'app qui la porte.
       Une machine nommée (DTF, Trotec, Roland UV) porte l'étiquette chaude ;
       « Autres » reste gris — ce n'est pas une machine, c'est le reste. */
    --panneau: #4a5c6e;
    --panneau-survol: #3d4d5d;
    --sur-panneau: #fff;
    --panneau-sourdine: rgba(255,255,255,.68);
    --panneau-voile: rgba(255,255,255,.16);
    --panneau-voile-fort: rgba(255,255,255,.28);
    --panneau-page: #efefec;
    --panneau-rail: #eceae5;
    --panneau-filet: #dedbd4;
    --machine-fond: #ece3cd;
    --machine-encre: #7a5b16;

    /* --------------------------------------------------------- LES ÉTATS
       LES PASTILLES DE LA MAQUETTE : gris pour ce qui attend, bleu pour ce
       qui est chez le client (« Devis envoyé »), vert pour ce qui est fait,
       rouge pour ce qui ne se fera pas. L'orange et le violet ne servent
       qu'aux pastilles de projet (expiré, en production, contrôle) — voir
       `.o-b-*` plus bas. Point, mot et fond clair, comme la maquette. */
    --etat-pret-encre: #0b7a50;
    --etat-pret-point: #0b7a50;
    --etat-retard-encre: #f26b5b;
    --etat-retard-point: #b91c1c;
    --etat-retard-fond: #fdeaea;

    /* ------------------------------------------------------- ÉLÉVATIONS
       La maquette pose ses cartes à plat, sur un filet : pas d'ombre. Seul ce
       qui flotte — un menu, une fenêtre — en porte une. */
    --ombre-1: 0 0 #0000;
    --ombre-2: 0 0 #0000;
    --ombre-flottant: 0 0 0 1px rgba(255,255,255,.09), 0 18px 44px rgba(0,0,0,.5);
    --voile: rgba(15,23,42,.45);

    /* ------------------------------------------------------- LE FOCUS */
    --anneau: 0 0 0 2px #6f95ff;
    --anneau-sur-plein: 0 0 0 2px var(--carte), 0 0 0 5px rgba(17,24,39,.35);

    /* --------------------------------------------- LES TAILLES DE TEXTE
       TROIS TAILLES, PAS UNE DE PLUS (18 septembre 2026, demande du patron :
       « 2/3 tailles, et compose avec du gras / moins gras »). Il y en avait
       onze à l'écran — 11, 12, 13, 14, 16, 18, 20, 22, 24, 28, 40 — et
       chacune paraissait juste seule ; ensemble, elles faisaient du bruit.
       La hiérarchie passe désormais par la GRAISSE et l'ENCRE, pas par la
       taille : 12 pour ce qui se repère en passant (en-tête de colonne,
       pastille, ligne grise sous un nom), 14 pour tout ce qui se lit, se
       tape et se clique, 20 pour un titre et un chiffre qu'on annonce.
       Les papiers A4 gardent leur échelle d'imprimerie (--p-*). */
    --t-petit: 12px;
    --t-corps: 14px;
    --t-titre: 20px;

    /* TROIS GRAISSES : 400 le texte, 500 ce qu'on repère (un intitulé, un
       bouton), 600 ce qui compte (un nom, un titre, un montant). Plus de
       700, 800 ni 900 à l'écran. */
    --g-texte: 400;
    --g-note: 500;
    --g-forte: 600;

    --lettre-caps: .06em;
    --lettre-chiffre: -.01em;
    --lettre-titre: 0;

    --l-titre: 1.2;
    --l-texte: 1.4;

    /* ====================================================== LES HAUTEURS
       Celles des boutons de la maquette : 42 px le bouton, 34 px le petit. */
    --commande-h: 42px;
    --commande-majeure: 46px;
    --commande-appoint: 34px;
    --rond: 36px;
    /* LA BOÎTE DE LA PRISE DE COMMANDE (23 septembre 2026, Charlie : « tout
       visuellement à la même hauteur ») : champ, case de la grille, pastille,
       menu, bouton — tout ce qui se touche au comptoir fait 44 px, la cible
       du doigt. La caisse en portait onze, de 30 à 54 px. */
    --commande-doigt: 44px;

    --etiquette-h: 26px;

    --arrondi: 10px;
    --arrondi-carte: 14px;
    --arrondi-fenetre: 16px;      /* le rayon d'une fenêtre (o-modal-card, o-papier) */
    --pilule: 999px;

    /* ------------------------------------------------- QUATRE PAS D'ÉCART
       Sept écarts, c'est un panneau dont le titre, le corps et le pied
       commencent chacun à un endroit différent. */
    --e1: 6px; --e2: 10px; --e3: 16px; --e4: 24px;

    /* ------------------------------------------------- LA BANDE D'ÉTAT
       Fixe, pleine largeur, en bas de la fenêtre — HORS DU FLUX du contenu.
       Le gabarit (voir la hauteur de la section racine) réserve exactement
       sa hauteur : la bande ne recouvre donc jamais rien. Celle-ci est sa
       hauteur d'UNE ligne, dérivée du texte qu'elle porte ; un échec peut la
       passer sur deux, et lib/etat.js pose alors sa vraie hauteur dans
       `--h-bande-place`, que la section racine lit en premier. */
    --h-bande-etat: calc(var(--t-petit) * var(--l-texte) + var(--e1) * 2);

    /* ---------------------------------------------------- LE MOUVEMENT
       AUCUNE ATTENTE VOULUE, JAMAIS (Charlie, 11 septembre 2026) : un clic
       montre son résultat tout de suite. Un tiroir qui glisse, un voile qui se
       fonce, un menu qui surgit se lisent comme un chargement. La durée reste
       nommée pour qu'aucun style ne la réécrive à la main — et elle vaut
       zéro. */
    --dur-1: 0s;                  /* un retour : fond, trait, focus */
    --sortie: cubic-bezier(.2,0,0,1);

    /* DEUX POLICES : Instrument Sans pour tout ce qui se lit (la police des
       tableaux de la maquette « Tableaux OLDA », étendue à toute l'app le
       18 septembre 2026 — l'écran mêlait Instrument Sans dans les tableaux
       et la police du système partout ailleurs, Inter n'étant jamais
       chargée), la chasse fixe pour les numéros de papier. */
    --police: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;

    /* ============================================================ LE PAPIER
       L'AUTRE MÉDIUM. Un A4 ne se mesure pas à l'échelle de l'écran : il
       garde ses points d'imprimerie et ses encres chaudes. Échelle fermée,
       elle aussi — sept tailles, trois encres, trois filets. */
    --p-micro: 7.5pt;             /* les intitulés en capitales */
    --p-pied: 8pt;                /* mentions légales et pied de page */
    --p-texte: 9.5pt;             /* le corps du document */
    --p-titre: 12pt;              /* raison sociale, numéro, nom du client */
    --p-geant: 16pt;              /* le montant qu'on annonce */
    --p-affiche: 24pt;            /* « Devis », « Facture » : fin, et grand */
    --p-iban: 8.5pt;              /* l'IBAN et le BIC, en chasse fixe */
    --p-leger: 300;               /* la seule graisse fine : le titre du papier */
    --p-encre: #1c1c1a;
    --p-encre-2: #6b6b66;
    --p-encre-3: #8a8984;         /* le pied légal */
    --p-filet: #e4e3df;
    --p-filet-pale: #d6d5d0;
    --p-filet-fort: #a8a7a1;
    --p-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --p-police: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  }
  /* ======================================================== LE LOGO MAKER
     (lib/studio-detourage.js) Le logo au centre de son plan, son fond et
     son zoom en bas ; à côté, ses couleurs et un bouton, le PDF — le reste
     dans « Plus ». Pas un réglage : le graphiste décide (lib/graphiste.js,
     27 septembre 2026). */
  .o-view.o-studio-vue { flex:1; min-height:0; display:flex; flex-direction:column; }
  .o-studio { flex:1; min-height:560px; display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:14px; }
  .o-studio-ic { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
  .o-studio [hidden] { display:none !important; }
  .o-studio kbd { display:inline-block; min-width:18px; padding:1px 5px; border:1px solid var(--filet-fort); border-bottom-width:2px; border-radius:var(--arrondi); background:var(--surface); font:inherit; font-size:var(--t-petit); line-height:16px; text-align:center; color:var(--encre-1); }

  /* LE PLAN DE TRAVAIL */
  .o-studio-scene { position:relative; min-width:0; min-height:0; overflow:hidden; border:1px solid var(--filet-carte); border-radius:var(--arrondi-carte); background:repeating-conic-gradient(#eef1f5 0% 25%, #fff 0% 50%) 0 0 / 22px 22px; touch-action:none; user-select:none; outline:none; }
  .o-studio-toile { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  .o-studio-saisi .o-studio-toile { cursor:grabbing; }


  /* LE COMPARATEUR : l'avant à gauche, l'après à droite, une poignée à
     glisser. */
  .o-studio-split { position:absolute; z-index:3; top:0; bottom:0; width:28px; margin-left:-14px; cursor:ew-resize; touch-action:none; }
  .o-studio-split::before { content:''; position:absolute; top:0; bottom:0; left:13px; width:2px; background:#fff; box-shadow:0 0 0 1px rgba(15,23,42,.14), 0 0 14px rgba(15,23,42,.22); }
  .o-studio-split i { position:absolute; top:50%; left:14px; width:38px; height:38px; display:grid; place-items:center; transform:translate(-50%, -50%); border-radius:50%; background:#fff; color:#111214; box-shadow:var(--ombre-flottant); transition:transform .12s; }
  .o-studio-split.o-studio-saisi i { transform:translate(-50%, -50%) scale(1.08); }
  .o-studio-split i .o-studio-ic { width:16px; height:16px; }
  .o-studio-split span { position:absolute; top:66px; padding:4px 10px; border-radius:var(--pilule); background:rgba(15,23,42,.78); color:#fff; font-size:var(--t-petit); font-weight:var(--g-forte); white-space:nowrap; pointer-events:none; }
  .o-studio-split [data-c="avant"] { right:26px; }
  .o-studio-split [data-c="apres"] { left:26px; background:var(--accent); }

  /* LA BARRE DU PLAN, en bas au centre : les cotes, la gomme, « Comparer », le zoom. */
  .o-studio-vuebar { position:absolute; z-index:4; left:50%; bottom:14px; transform:translateX(-50%); display:flex; align-items:center; gap:4px; padding:5px; border-radius:var(--arrondi-carte); background:rgba(24,25,28,.82); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.1); box-shadow:var(--ombre-flottant); transition:opacity .18s; }
  .o-studio-vuebar.o-studio-cache { opacity:0; pointer-events:none; }
  .o-studio-pastille { width:18px; height:18px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .o-studio-outil { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 10px; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-1); font:inherit; font-size:var(--t-petit); font-weight:var(--g-forte); font-variant-numeric:tabular-nums; white-space:nowrap; cursor:pointer; touch-action:none; }
  .o-studio-outil .o-studio-ic { width:16px; height:16px; }
  .o-studio-outil.o-studio-carre { width:32px; padding:0; justify-content:center; }
  .o-studio-outil:hover { background:var(--zone); }
  .o-studio-outil[aria-pressed="true"], .o-studio-outil[aria-pressed="true"]:hover { background:var(--encre-1); color:#111214; }
  .o-studio-badge { position:absolute; z-index:4; top:66px; left:14px; padding:6px 12px; border-radius:var(--pilule); background:rgba(15,23,42,.82); color:#fff; font-size:var(--t-petit); font-weight:var(--g-forte); pointer-events:none; }

  /* L'ACCUEIL, avant le premier logo. */
  .o-studio-accueil { position:absolute; inset:0; z-index:5; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.6), rgba(255,255,255,.94) 70%); }
  .o-studio-accueil-carte { width:min(420px, 100%); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; gap:18px; padding:44px 32px 30px; text-align:center; background:var(--surface); border:1.5px dashed var(--filet-fort); border-radius:var(--arrondi-fenetre); box-shadow:var(--ombre-flottant); }
  .o-studio-accueil-rond { width:68px; height:68px; display:grid; place-items:center; border-radius:var(--arrondi-fenetre); background:var(--zone); color:var(--encre-1); }
  .o-studio-accueil-rond .o-studio-ic { width:32px; height:32px; stroke-width:1.5; }
  .o-studio-accueil h3 { margin:0; font-size:var(--t-titre); font-weight:var(--g-forte); color:var(--encre-1); }
  .o-studio-accueil .o-studio-bouton { min-height:44px; padding:0 20px; }
  .o-studio-puces-formats { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:6px; }
  .o-studio-puces-formats span { padding:3px 8px; border-radius:var(--pilule); background:var(--zone); color:var(--encre-2); font-size:var(--t-petit); font-weight:var(--g-forte); }
  .o-studio-puces-formats em { width:1px; height:16px; margin:0 4px; background:var(--filet-carte); }
  .o-studio-touches { display:inline-flex; gap:4px; white-space:nowrap; }
  .o-studio-depot { position:absolute; inset:10px; z-index:6; display:none; place-items:center; border:2px dashed var(--accent); border-radius:var(--arrondi-carte); background:rgba(2,132,199,.08); pointer-events:none; }
  .o-studio-depot span { display:flex; align-items:center; gap:10px; padding:12px 18px; border-radius:var(--arrondi); background:var(--accent); color:var(--sur-accent); font-weight:var(--g-forte); box-shadow:var(--ombre-flottant); }
  .o-studio-survol .o-studio-depot { display:grid; }
  /* L'IA CHERCHE : un balayage lumineux passe sur la photo pâlie. */
  .o-studio-cherche::after { content:''; position:absolute; inset:0; z-index:2; pointer-events:none; background:linear-gradient(100deg, transparent 35%, rgba(2,132,199,.14) 50%, transparent 65%) no-repeat; background-size:250% 100%; animation:o-studio-balaye 1.8s linear infinite; }
  @keyframes o-studio-balaye { from { background-position:150% 0; } to { background-position:-50% 0; } }

  /* LA PRÉPARATION (lib/studio-detourage.js, `dessinerPrep`) : la barre
     seule, au milieu du plan — voir « Comme Analyser » plus bas. */
  .o-studio-prep { position:absolute; z-index:5; box-sizing:border-box; }
  .o-studio-prep-dit { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }

  /* CE QUI S'EST PASSÉ */
  .o-studio-toast { position:absolute; z-index:5; left:50%; bottom:112px; transform:translate(-50%, 8px); padding:8px 14px; border-radius:var(--pilule); background:var(--encre-1); color:#111214; box-shadow:var(--ombre-flottant); font-size:var(--t-petit); font-weight:var(--g-forte); opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; white-space:nowrap; font-variant-numeric:tabular-nums; }
  /* LA VIGNETTE DU LOGO REFAIT, à glisser dans la fenêtre ChatGPT. */
  .o-chatgpt-vignette { position:fixed; z-index:50; right:16px; bottom:16px; display:flex; align-items:center; gap:12px; padding:10px; border-radius:var(--arrondi-carte); background:var(--surface); color:var(--encre-1); box-shadow:var(--ombre-flottant); border:1px solid var(--filet-fort); }
  .o-chatgpt-vignette img { width:72px; height:72px; object-fit:contain; border-radius:var(--arrondi); cursor:grab; background:repeating-conic-gradient(#e9e9ec 0 25%, #fff 0 50%) 0 0/12px 12px; }
  .o-chatgpt-vignette img:active { cursor:grabbing; }
  .o-chatgpt-vignette p { margin:0; display:flex; flex-direction:column; gap:2px; font-size:var(--t-petit); }
  .o-chatgpt-vignette p span { color:var(--encre-2); }
  .o-chatgpt-vignette button { min-height:36px; padding:0 12px; border-radius:var(--pilule); border:1px solid var(--filet-fort); background:transparent; color:inherit; font:inherit; font-weight:var(--g-forte); cursor:pointer; }
  .o-chatgpt-vignette .o-chatgpt-fermer { min-width:36px; padding:0; border:0; font-size:20px; opacity:.6; }
  .o-chatgpt-vignette button:hover { opacity:1; background:var(--survol-fort); }
  .o-studio-toast[data-ton="alerte"] { background:var(--etat-retard-encre); }
  .o-studio-montre { opacity:1; transform:translate(-50%, 0); }

  /* LA BARRE (30 septembre 2026) : fine, au-dessus du studio — la marque,
     le fichier et ses dimensions, puis Annuler, Rétablir, l'historique des
     gestes et Changer (lib/studio-detourage.js, `gabaritBarre`). */
  /* LA BARRE OLDA (21/11/2026, Charlie : la barre du Logo maker est le modèle) —
     la même, au pixel, en tête de BAT Studio, du Logo maker et du planning :
     « ‹ Dashboard », OLDA + le nom de l'appli en gris, un filet, le titre de
     l'écran en gras ; à droite des outils (icône, + libellé) et un bouton
     encadré. Clair par défaut, `.ob-sombre` pour le sombre. Cibles de 44 px.
     Copiée telle quelle dans les trois applis : ne la retoucher qu'ici, puis
     partout (side-session-notes/…/barre-olda.css). */
  .ob-barre {
    --ob-fond: #fff; --ob-encre: #1f2328; --ob-encre-2: #6b7075; --ob-encre-3: #a3a7ab;
    --ob-filet: #e4e6e9; --ob-filet-fort: #cdd0d4; --ob-zone: rgba(31, 35, 40, .06); --ob-surface: #fff;
    --ob-anneau: 0 0 0 2px #6f95ff;
    position: relative; z-index: 40; flex: none; box-sizing: border-box;
    height: calc(60px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 14px;
    margin: 0; padding: env(safe-area-inset-top) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
    background: var(--ob-fond); border: 0; border-bottom: 1px solid var(--ob-filet); border-radius: 0; box-shadow: none;
    color: var(--ob-encre);
    font: 400 14px/1.25 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    letter-spacing: normal; -webkit-font-smoothing: antialiased;
  }
  .ob-barre.ob-sombre {
    --ob-fond: #0e0f11; --ob-encre: #f4f4f2; --ob-encre-2: #a2a2a0; --ob-encre-3: #75757a;
    --ob-filet: #26272b; --ob-filet-fort: #3a3b41; --ob-zone: #24252a; --ob-surface: #202125;
  }
  .ob-barre :is(.retour-dash, .ob-outil, .ob-bouton) { box-sizing: border-box; }
  .ob-barre [hidden] { display: none !important; }
  .ob-barre .retour-dash {
    flex: none; display: inline-flex; align-items: center; gap: 2px;
    min-height: 44px; margin: 0; padding: 0 14px 0 8px;
    border: 1px solid var(--ob-filet-fort); border-radius: 999px; background: var(--ob-zone);
    color: var(--ob-encre); font: inherit; font-weight: 600; line-height: 1; text-decoration: none; white-space: nowrap;
  }
  .ob-barre .retour-dash svg { display: block; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ob-barre .retour-dash span { display: inline; }
  .ob-barre .retour-dash:hover { border-color: var(--ob-encre-3); background: var(--ob-zone); color: var(--ob-encre); text-decoration: none; }
  .ob-marque { flex: none; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
  .ob-marque b { font-weight: 600; color: var(--ob-encre); }
  .ob-marque span { color: var(--ob-encre-2); }
  .ob-filet { flex: none; width: 1px; height: 22px; background: var(--ob-filet); }
  .ob-titre { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .ob-titre b { min-width: 0; flex: 0 1 auto; font-size: 16px; font-weight: 600; color: var(--ob-encre); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ob-titre span { min-width: 0; flex: 0 1000 auto; font-size: 12px; color: var(--ob-encre-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ob-actions { flex: none; display: flex; align-items: center; gap: 2px; }
  .ob-actions .ob-filet { margin: 0 6px; }
  .ob-outil {
    flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 44px; min-width: 44px; margin: 0; padding: 0 10px;
    border: 0; border-radius: 10px; background: transparent; color: var(--ob-encre);
    font: inherit; font-weight: 500; white-space: nowrap; text-decoration: none; cursor: pointer;
  }
  .ob-outil.ob-carre { width: 44px; padding: 0; }
  .ob-outil svg { flex: none; width: 18px; height: 18px; }
  .ob-outil:hover:not(:disabled), .ob-outil[aria-expanded="true"] { background: var(--ob-zone); }
  .ob-outil:disabled { color: var(--ob-encre-3); cursor: default; }
  .ob-bouton {
    flex: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 44px; margin: 0; padding: 0 16px;
    border: 1px solid var(--ob-filet); border-radius: 10px; background: var(--ob-surface); color: var(--ob-encre);
    font: inherit; font-weight: 600; white-space: nowrap; cursor: pointer;
    transition: background .12s, border-color .12s, transform .08s;
  }
  .ob-bouton svg { flex: none; width: 16px; height: 16px; }
  .ob-bouton:hover:not(:disabled) { border-color: var(--ob-filet-fort); background: var(--ob-zone); }
  .ob-bouton:active:not(:disabled) { transform: translateY(1px); }
  .ob-bouton:disabled { opacity: .55; cursor: default; }
  .ob-barre :is(.retour-dash, .ob-outil, .ob-bouton):focus-visible { outline: none; box-shadow: var(--ob-anneau); }
  /* LE MENU « HISTORIQUE », sous son bouton : un geste par ligne, le plus
     récent en haut ; celui à l'écran cerclé, ceux à rétablir en gris. */
  .o-studio-menu.o-studio-historique { top:calc(100% + 6px); bottom:auto; right:8px; width:320px; max-height:min(440px, 70vh); overflow:auto; }
  .o-studio-histo .o-studio-article-mot { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-histo small { flex:none; }
  .o-studio-histo[aria-checked="true"] { background:var(--zone); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .o-studio-histo-apres .o-studio-article-mot { color:var(--encre-2); font-weight:var(--g-note); }
  .o-studio-histo:focus-visible { outline:none; box-shadow:var(--anneau); }

  /* LE PANNEAU : ses réglages, ses couleurs, et le bouton du PDF, toujours
     en bas. */
  .o-studio-panneau { position:relative; min-height:0; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--filet-carte); border-radius:var(--arrondi-carte); }
  .o-studio-defile { flex:1; min-height:0; overflow:auto; }
  .o-studio-bloc { display:flex; flex-direction:column; gap:12px; padding:14px 16px 16px; transition:opacity .15s; }
  .o-studio-bloc[inert], .o-studio-pied[inert] { opacity:.4; }
  .o-studio-bloc-tete { display:flex; align-items:baseline; justify-content:space-between; gap:10px; min-height:20px; }
  .o-studio-bloc-tete b { font-size:var(--t-corps); font-weight:var(--g-forte); color:var(--encre-1); }
  .o-studio-bloc-tete span { font-size:var(--t-petit); color:var(--encre-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-bloc + .o-studio-bloc { border-top:1px solid var(--filet-carte); }
  /* La couleur retirée, à droite du titre « Fond ». */
  .o-studio-bloc-tete span:has(.o-studio-fond-teinte) { display:flex; gap:4px; }
  .o-studio-fond-teinte { display:inline-block; width:14px; height:14px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }

  /* UNE LIGNE ET SON INTERRUPTEUR : « Améliorer l'image », le blanc DTF. */
  .o-studio-ligne { display:flex; align-items:center; gap:10px; min-height:32px; }
  .o-studio-ligne-ic { width:30px; height:30px; flex:none; display:grid; place-items:center; border-radius:var(--arrondi); background:var(--zone); color:var(--encre-1); }
  .o-studio-ligne-ic .o-studio-ic { width:16px; height:16px; }
  .o-studio-ligne-mot { flex:1; min-width:0; display:flex; align-items:baseline; gap:8px; font-size:var(--t-corps); color:var(--encre-1); }
  .o-studio-ligne-mot b { font-weight:var(--g-forte); white-space:nowrap; }
  .o-studio-ligne-mot small { font-size:var(--t-petit); color:var(--encre-2); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-inter { position:relative; width:38px; height:22px; flex:none; padding:0; border:0; border-radius:var(--pilule); background:var(--filet-fort); cursor:pointer; transition:background .15s; }
  .o-studio-inter i { position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(15,23,42,.3); transition:transform .15s; }
  .o-studio-inter[aria-checked="true"] { background:var(--accent); }
  .o-studio-inter[aria-checked="true"] i { transform:translateX(16px); }
  .o-studio-inter:focus-visible { outline:none; box-shadow:var(--anneau); }

  .o-studio-segment { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; padding:3px; border-radius:var(--arrondi); background:var(--zone); border:1px solid var(--filet-carte); }
  .o-studio-segment button { display:inline-flex; align-items:center; justify-content:center; gap:6px; height:32px; white-space:nowrap; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-2); font:inherit; font-size:var(--t-corps); font-weight:var(--g-forte); cursor:pointer; transition:background .12s, color .12s, box-shadow .12s; }
  .o-studio-segment button:hover { color:var(--encre-1); }
  .o-studio-segment button[aria-checked="true"] { background:var(--surface); color:var(--encre-1); box-shadow:0 1px 3px rgba(15,23,42,.14), 0 0 0 1px rgba(15,23,42,.04); }
  .o-studio-segment .o-studio-ic { width:15px; height:15px; color:var(--accent); }

  /* LES CURSEURS : le seuil du fond, le lissage du tracé, les nuances des
     couleurs — le graphiste les règle, la vendeuse les ajuste, le résultat
     suit en direct. */
  .o-studio-curseur { display:flex; flex-direction:column; gap:2px; }
  .o-studio-curseur-tete { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .o-studio-curseur label { font-size:var(--t-corps); color:var(--encre-1); }
  .o-studio-curseur output { font-size:var(--t-petit); font-weight:var(--g-forte); font-variant-numeric:tabular-nums; color:var(--encre-2); }
  .o-studio input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:24px; margin:0; background:transparent; cursor:pointer; }
  .o-studio input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:var(--pilule); background:linear-gradient(to right, var(--accent) var(--p, 0%), var(--filet-fort) var(--p, 0%)); }
  .o-studio input[type=range]::-moz-range-track { height:4px; border-radius:var(--pilule); background:linear-gradient(to right, var(--accent) var(--p, 0%), var(--filet-fort) var(--p, 0%)); }
  .o-studio input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; margin-top:-7px; border-radius:50%; background:var(--surface); border:1px solid rgba(15,23,42,.18); box-shadow:0 1px 4px rgba(15,23,42,.25); transition:transform .1s; }
  .o-studio input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:var(--surface); border:1px solid rgba(15,23,42,.18); box-shadow:0 1px 4px rgba(15,23,42,.25); }
  .o-studio input[type=range]:active::-webkit-slider-thumb { transform:scale(1.15); }
  .o-studio input[type=range]:focus-visible { outline:none; }
  .o-studio input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow:var(--anneau), 0 1px 4px rgba(15,23,42,.25); }
  .o-studio input[type=range]:focus-visible::-moz-range-thumb { box-shadow:var(--anneau); }

  .o-studio-bouton { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:0 14px; border:1px solid var(--filet-carte); border-radius:var(--arrondi); background:var(--surface); color:var(--encre-1); font:inherit; font-size:var(--t-corps); font-weight:var(--g-forte); cursor:pointer; transition:background .12s, border-color .12s, transform .08s, box-shadow .12s; }
  .o-studio-bouton:hover:not(:disabled) { border-color:var(--filet-fort); background:var(--zone); }
  .o-studio-bouton:active:not(:disabled) { transform:translateY(1px); }
  .o-studio-bouton:disabled { opacity:.55; cursor:default; }
  .o-studio-plein { background:var(--accent); border-color:var(--accent); color:var(--sur-accent); }
  .o-studio-plein:hover:not(:disabled) { background:var(--accent-survol); border-color:var(--accent-survol); }
  .o-studio-discret { min-height:34px; }

  /* LA PALETTE : chaque teinte du logo, qu'un clic change ou retire. */
  .o-studio-palette { display:flex; flex-wrap:wrap; gap:8px; }
  /* LA POLICE AU CLIC (30 septembre 2026 : « on clique sur la police et on
     choisit directement, pour éviter une barre latérale trop grande »). Le
     panneau ne garde qu'une ligne par texte lu — un point (vert : police
     reconnue et posée ; bleu : choisie à la main ; gris : le dessin), le
     texte, sa police — qu'un clic (sur le plan ou ici) ouvre dans
     l'inspecteur, où chaque police se montre dans son propre dessin. */
  .o-studio-textes { display:flex; flex-direction:column; gap:2px; }
  .o-studio-police-aide { font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-ligne-texte { display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; column-gap:8px; width:100%; min-height:30px; margin:0 -8px; padding:0 8px; box-sizing:content-box; border:0; border-radius:var(--arrondi); background:transparent; font:inherit; font-size:var(--t-corps); color:var(--encre-1); text-align:left; cursor:pointer; }
  .o-studio-ligne-texte:hover { background:var(--zone); }
  .o-studio-ligne-texte[aria-pressed="true"] { background:var(--zone); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .o-studio-ligne-texte:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-ligne-texte i { width:8px; height:8px; border-radius:50%; background:var(--filet-fort); }
  .o-studio-ligne-texte i[data-etat="reconnue"] { background:var(--succes); }
  .o-studio-ligne-texte i[data-etat="choisie"] { background:var(--accent); }
  .o-studio-ligne-texte i[data-etat="recherche"] { background:#d97706; }
  .o-studio-ligne-texte-mot { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* La police d'une ligne, lisible (1er octobre 2026 : un pourcentage de
     sa colonne « auto » la réduisait à « D… »). */
  .o-studio-ligne-texte small { max-width:150px; font-size:var(--t-petit); color:var(--encre-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Le texte lu d'une ligne : un champ, pointillé tant qu'on n'y touche pas — il se corrige s'il est mal lu. */
  .o-studio-texte-mot { box-sizing:border-box; width:100%; height:30px; padding:0 10px; border:1px dashed var(--filet-carte); border-radius:var(--arrondi); background:transparent; font:inherit; font-size:var(--t-petit); color:var(--encre-2); text-overflow:ellipsis; }
  .o-studio-texte-mot:hover { border-color:var(--filet-fort); }
  .o-studio-texte-mot:focus { outline:none; border-style:solid; border-color:var(--filet-fort); background:var(--surface); color:var(--encre-1); box-shadow:var(--anneau); }
  /* L'INSPECTEUR (12 octobre 2026 : « la bulle de modification s'ouvre
     directement sur l'objet que je souhaite modifier, c'est
     insupportable ») : les propriétés de la sélection — une ligne de
     texte, une forme, plusieurs — À LA PLACE des réglages du logo, dans le
     panneau ; rien ne flotte sur le plan. En tête : retour, le titre (le
     texte d'une ligne, à corriger s'il est mal lu), l'élément précédent et
     le suivant ; puis ses blocs (Police, Gras autour, Couleur, Géométrie,
     Retirer). Le pied du panneau (la taille DTF, le PDF) reste en bas. */
  .o-studio-inspecteur { flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto; outline:none; }
  .o-studio-insp-tete { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:2px; padding:8px 8px 8px 6px; background:var(--surface); border-bottom:1px solid var(--filet-carte); }
  .o-studio-insp-tete .o-studio-texte-mot { flex:1; min-width:0; height:34px; margin:0 4px; font-size:var(--t-corps); font-weight:var(--g-forte); color:var(--encre-1); }
  .o-studio-insp-titre { flex:1; min-width:0; display:flex; align-items:center; gap:8px; height:34px; padding:0 6px; }
  .o-studio-insp-titre i { width:18px; height:18px; flex:none; border-radius:var(--arrondi); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .o-studio-insp-titre b { min-width:0; font-size:var(--t-corps); font-weight:var(--g-forte); color:var(--encre-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-insp-titre small { min-width:0; font-size:var(--t-petit); color:var(--encre-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-insp-nav { width:34px; height:34px; flex:none; display:grid; place-items:center; padding:0; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-2); cursor:pointer; transition:background .12s, color .12s; }
  .o-studio-insp-nav:hover:not(:disabled) { background:var(--zone); color:var(--encre-1); }
  .o-studio-insp-nav:disabled { color:var(--encre-3); cursor:default; }
  .o-studio-insp-nav:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-insp-nav .o-studio-ic { width:18px; height:18px; }
  .o-studio-insp-retour { color:var(--encre-1); }
  .o-studio-insp-bloc { display:flex; flex-direction:column; gap:10px; padding:12px 16px 14px; }
  .o-studio-insp-bloc + .o-studio-insp-bloc { border-top:1px solid var(--filet-carte); }
  .o-studio-insp-bloc .o-studio-recherche { padding-top:10px; }
  .o-studio-insp-bloc .o-studio-pop-couleur { padding-top:0; border-top:0; }
  .o-studio-insp-bloc .o-studio-geo, .o-studio-insp-bloc .o-studio-gras { margin:0; }
  .o-studio-insp-boutons { display:flex; justify-content:flex-start; gap:6px; }
  .o-studio-insp-bloc .o-studio-pop-retirer, .o-studio-insp-bloc .o-studio-pop-retirer .o-studio-ic { color:var(--danger); }
  .o-studio-insp-bloc .o-studio-pop-retirer .o-studio-ic { width:16px; height:16px; }
  /* Le panneau glisse d'une vue à l'autre (200 ms), pas de saut. */
  @keyframes o-studio-entre { from { opacity:0; transform:translateX(12px); } to { opacity:1; transform:none; } }
  @keyframes o-studio-revient { from { opacity:0; transform:translateX(-12px); } to { opacity:1; transform:none; } }
  .o-studio-inspecteur.o-studio-anime { animation:o-studio-entre .2s cubic-bezier(.2,.7,.2,1); }
  .o-studio-defile.o-studio-anime { animation:o-studio-revient .2s cubic-bezier(.2,.7,.2,1); }
  @media (prefers-reduced-motion: reduce) { .o-studio-inspecteur.o-studio-anime, .o-studio-defile.o-studio-anime { animation:none; } }
  .o-studio-pop-liste { display:flex; flex-direction:column; gap:2px; max-height:min(340px, 50vh); margin:0 -6px; padding:0 6px; overflow:auto; }
  .o-studio-pop-ligne { display:flex; flex-direction:column; align-items:flex-start; gap:1px; width:100%; min-height:44px; padding:6px 10px; border:0; border-radius:var(--arrondi); background:transparent; font:inherit; color:var(--encre-1); text-align:left; cursor:pointer; }
  .o-studio-pop-ligne:hover { background:var(--zone); }
  .o-studio-pop-ligne[aria-checked="true"] { background:var(--zone); box-shadow:inset 0 0 0 1.5px var(--accent); }
  .o-studio-pop-ligne:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-pop-apercu { display:block; max-width:100%; font-size:var(--t-titre); line-height:1.25; font-weight:var(--g-texte); font-style:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-pop-ligne small { font-size:var(--t-petit); color:var(--encre-2); white-space:nowrap; }
  .o-studio-pop-ligne small b { color:var(--succes-encre); font-weight:var(--g-forte); }
  .o-studio-pop-vide { padding:8px 10px; font-size:var(--t-petit); color:var(--encre-2); }
  /* LA RÉSERVE (1er octobre 2026) : où la police se cherche — Google, le
     poste, les polices déposées —, et de quoi l'agrandir. */
  .o-studio-reserve { display:flex; align-items:center; flex-wrap:wrap; gap:4px 10px; margin-top:6px; padding-top:8px; border-top:1px solid var(--filet-carte); font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-reserve-dit { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .o-studio-lien { display:inline-flex; align-items:center; gap:4px; min-height:28px; margin:0 -6px; padding:0 6px; border:0; border-radius:var(--arrondi); background:transparent; font:inherit; font-size:var(--t-petit); font-weight:var(--g-forte); color:var(--accent); white-space:nowrap; cursor:pointer; }
  .o-studio-lien:hover:not(:disabled) { background:var(--zone); color:var(--accent-survol); }
  .o-studio-lien:disabled { color:var(--encre-2); cursor:default; }
  .o-studio-lien:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-lien .o-studio-ic { width:14px; height:14px; }
  .o-studio-lien[hidden] { display:none; }
  .o-studio-reserve .o-studio-lien { margin:0; }
  /* La recherche d'une police par son nom, dans l'inspecteur ; d'où vient une
     police (le poste, déposée) et sa jumelle commerciale (« ≈ Futura »). */
  .o-studio-recherche { display:flex; flex-direction:column; gap:4px; padding-top:8px; border-top:1px solid var(--filet-carte); }
  .o-studio-recherche .o-studio-lien { align-self:flex-start; margin:0; }
  .o-studio-cherche-mot { border-style:solid; }
  .o-studio-recherche .o-studio-pop-liste { max-height:min(220px, 34vh); }
  .o-studio-recherche .o-studio-pop-liste:empty { display:none; }
  /* Dans l'inspecteur, les listes de polices (les proposées, les
     trouvées) ne défilent pas à part : c'est l'inspecteur qui défile. Sans
     plafond ni rétrécissement — plafonnée à 220 px, la liste des polices
     trouvées rognait le haut de chaque dessin (12 octobre 2026). */
  .o-studio-inspecteur .o-studio-pop-liste { max-height:none; margin:0 -8px; padding:0; overflow:visible; }
  .o-studio-inspecteur .o-studio-pop-ligne { flex:none; }
  .o-studio-pop-ligne small { white-space:normal; }
  .o-studio-source, .o-studio-equivalent { font-style:normal; white-space:nowrap; }
  .o-studio-source { padding:0 6px; border-radius:var(--pilule); background:var(--zone); color:var(--encre-1); font-weight:var(--g-note); }
  .o-studio-pop-ligne[aria-checked="true"] .o-studio-source { background:var(--surface); }
  /* Le gras autour des lettres d'une ligne : sous sa police, éteint sans police choisie. */
  .o-studio-gras { margin-top:2px; }
  .o-studio-gras label { font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-gras input[type=range]:disabled { opacity:.45; cursor:default; }
  .o-studio-palette-vide { font-size:var(--t-petit); color:var(--encre-2); }
  /* LES CALQUES (12 octobre 2026) : chaque ligne du bloc — une ligne de
     texte, une forme — et son œil ; retirée, elle s'éteint. Un clic ouvre
     l'inspecteur de l'élément (sa couleur, sa géométrie, Retirer). */
  .o-studio-calque { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:2px; }
  .o-studio-calque[data-cache] .o-studio-ligne-texte { opacity:.45; }
  .o-studio-calque .o-studio-ligne-texte:disabled { cursor:default; }
  .o-studio-oeil { width:30px; height:30px; flex:none; display:grid; place-items:center; padding:0; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-2); cursor:pointer; }
  .o-studio-oeil:hover { background:var(--zone); color:var(--encre-1); }
  .o-studio-oeil:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-oeil .o-studio-ic { width:16px; height:16px; }
  .o-studio-oeil[aria-pressed="false"] { color:var(--encre-3); }
  .o-studio-forme i { width:10px; height:10px; margin-left:-1px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .o-studio-ligne-texte i[style] { box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  [data-r="formes"] + .o-studio-reserve { margin-top:8px; }
  .o-studio-pop-couleur { display:flex; flex-direction:column; gap:4px; padding-top:8px; border-top:1px solid var(--filet-carte); }
  .o-studio-pop-couleur label { font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-pop-couleur output { font-size:var(--t-petit); font-weight:var(--g-forte); color:var(--encre-2); }
  .o-studio-origine { background:#fff; background-image:linear-gradient(135deg, transparent 45%, var(--danger) 45%, var(--danger) 55%, transparent 55%); }
  /* LA GOMME : le lasso se trace au réticule ; sa bulle (Combler, Retirer)
     se pose hors de son cadre, jamais sur ce qu'on vient d'entourer. */
  .o-studio-scene[data-outil="gomme"] .o-studio-toile { cursor:crosshair; }
  .o-studio-pop.o-studio-pop-lasso { z-index:6; }
  .o-studio-outil[aria-pressed="true"] { background:var(--zone); color:var(--accent); }
  [data-r="pop-lasso"] .o-studio-pop-pied .o-studio-bouton { flex:1; justify-content:center; }
  [data-r="pop-lasso"] .o-studio-bouton.o-studio-plein { color:var(--sur-action); }
  [data-r="pop-lasso"] .o-studio-bouton.o-studio-plein .o-studio-ic { color:var(--sur-action); }
  .o-studio-teinte { position:relative; width:36px; height:36px; display:grid; place-items:center; padding:0; border:1px solid var(--filet-carte); border-radius:var(--arrondi); background:var(--surface); cursor:pointer; transition:border-color .12s, box-shadow .12s; }
  .o-studio-teinte i { width:26px; height:26px; border-radius:var(--arrondi); box-shadow:inset 0 0 0 1px rgba(255,255,255,.14); }
  .o-studio-teinte em { position:absolute; right:-4px; bottom:-4px; width:13px; height:13px; border-radius:50%; border:2px solid var(--carte); box-shadow:0 0 0 1px rgba(15,23,42,.2); }
  .o-studio-teinte:hover:not(:disabled), .o-studio-teinte.o-studio-ouverte { border-color:var(--accent); box-shadow:0 0 0 3px rgba(2,132,199,.16); }
  .o-studio-teinte:disabled { cursor:default; opacity:.7; }
  .o-studio-retiree { border-style:dashed; }
  .o-studio-retiree i { opacity:.28; }
  .o-studio-retiree::after { content:''; position:absolute; inset:7px; border-radius:var(--arrondi); background:linear-gradient(to top right, transparent calc(50% - 1px), var(--etat-retard-encre) calc(50% - 1px), var(--etat-retard-encre) calc(50% + 1px), transparent calc(50% + 1px)); }
  .o-studio-pastilles { display:grid; grid-template-columns:repeat(auto-fill, minmax(28px, 1fr)); gap:4px; }
  .o-studio-pastilles button { display:grid; place-items:center; height:30px; padding:0; border:1px solid transparent; border-radius:var(--arrondi); background:transparent; cursor:pointer; }
  .o-studio-pastilles button:hover { background:var(--zone); }
  .o-studio-pastilles button[aria-checked="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .o-studio-pastilles i { width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  /* LA BULLE D'UNE TEINTE : le nuancier OLDA, une autre, l'origine, ou la
     retirer du logo. */
  .o-studio-pop { position:absolute; z-index:20; width:240px; box-sizing:border-box; display:flex; flex-direction:column; gap:10px; padding:12px; border-radius:var(--arrondi-carte); background:var(--surface); border:1px solid var(--filet-carte); box-shadow:var(--ombre-flottant); }
  .o-studio-pop-tete { display:flex; align-items:center; gap:8px; }
  .o-studio-pop-tete i { width:22px; height:22px; border-radius:var(--arrondi); box-shadow:inset 0 0 0 1px rgba(255,255,255,.15); }
  .o-studio-pop-tete b { flex:1; font-size:var(--t-corps); font-weight:var(--g-forte); font-variant-numeric:tabular-nums; }
  .o-studio-pop-tete small { display:block; font-size:var(--t-petit); font-weight:var(--g-texte); color:var(--encre-2); }
  .o-studio-pop-x { width:28px; height:28px; display:grid; place-items:center; padding:0; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-2); cursor:pointer; }
  .o-studio-pop-x:hover { background:var(--zone); color:var(--encre-1); }
  .o-studio-pop-grille { display:grid; grid-template-columns:repeat(9, 1fr); gap:2px; }
  .o-studio-pop-grille button { height:26px; display:grid; place-items:center; padding:0; border:0; border-radius:var(--arrondi); background:transparent; cursor:pointer; }
  .o-studio-pop-grille button:hover { background:var(--zone); }
  .o-studio-pop-grille button[aria-current="true"] { box-shadow:inset 0 0 0 2px var(--accent); }
  .o-studio-pop-grille i { width:20px; height:20px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(255,255,255,.2); }
  .o-studio-pop-pied { display:flex; gap:6px; }
  .o-studio-pop-pied .o-studio-bouton { min-height:34px; padding:0 10px; font-size:var(--t-petit); }
  /* LA GÉOMÉTRIE D'UN ÉLÉMENT (les calques déplacés) : X, Y ; L, cadenas, H ; angle, retourner, replacer. */
  .o-studio-geo { display:grid; grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr); gap:6px 6px; align-items:center; margin:8px 0; }
  .o-studio-geo-champ { display:flex; align-items:center; gap:4px; min-width:0; font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-geo-champ span { width:12px; flex:none; font-weight:var(--g-forte); color:var(--encre-2); }
  .o-studio-geo-champ input { flex:1; min-width:0; width:100%; height:28px; padding:0 6px; border:1px dashed var(--filet-carte); border-radius:var(--arrondi); background:transparent; font:inherit; font-size:var(--t-petit); color:var(--encre-1); text-align:right; }
  .o-studio-geo-champ input:hover { border-color:var(--filet-fort); }
  .o-studio-geo-champ input:focus { outline:none; border-style:solid; border-color:var(--filet-fort); background:var(--surface); box-shadow:var(--anneau); }
  .o-studio-geo-champ small { flex:none; color:var(--encre-3); }
  .o-studio-geo-champ:nth-child(1) { grid-column:1; }
  .o-studio-geo-champ:nth-child(2) { grid-column:3; }
  .o-studio-geo-cadenas { width:28px; height:28px; display:grid; place-items:center; padding:0; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-3); cursor:pointer; }
  .o-studio-geo-cadenas:hover { background:var(--zone); color:var(--encre-1); }
  .o-studio-geo-cadenas[aria-pressed="true"] { color:var(--accent); }
  .o-studio-geo-cadenas .o-studio-ic { width:15px; height:15px; }
  .o-studio-geo-boutons { grid-column:2 / span 2; display:flex; gap:4px; justify-content:flex-end; }
  .o-studio-geo-boutons .o-studio-bouton { min-height:28px; height:28px; padding:0 8px; font-size:var(--t-petit); display:inline-flex; align-items:center; gap:4px; color:var(--encre-1); }
  .o-studio-geo-boutons .o-studio-ic { width:15px; height:15px; }
  .o-studio-deplace { display:inline-grid; place-items:center; width:14px; height:14px; margin-left:4px; vertical-align:-3px; color:var(--accent); }
  .o-studio-deplace .o-studio-ic { width:12px; height:12px; }
  .o-studio-pop-autre { position:relative; flex:1; }
  .o-studio-pop-autre i { width:16px; height:16px; border-radius:50%; }
  .o-studio-pop-autre input { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:0; opacity:0; cursor:pointer; }
  .o-studio-pop-retirer { color:var(--etat-retard-encre); }
  .o-studio-pop-large { width:100%; }
  /* L'INFOBULLE D'UNE PASTILLE : son nom, ses encres CMJN. */
  .o-studio-infobulle { position:fixed; z-index:60; display:flex; flex-direction:column; gap:3px; padding:8px 11px; border-radius:var(--arrondi); background:var(--encre-1); color:#111214; font-size:var(--t-petit); white-space:nowrap; font-variant-numeric:tabular-nums; pointer-events:none; box-shadow:var(--ombre-flottant); }
  .o-studio-infobulle > b { font-size:var(--t-corps); font-weight:var(--g-forte); }
  .o-studio-infobulle em { font-style:normal; color:rgba(255,255,255,.7); }
  .o-studio-infobulle-encres { display:flex; gap:10px; color:rgba(255,255,255,.6); }
  .o-studio-infobulle-encres b { color:#fff; font-weight:var(--g-forte); }
  .o-studio-infobulle small { font-size:var(--t-petit); color:rgba(255,255,255,.5); }

  /* LE PDF, toujours en bas du panneau, et « Plus » à côté. */
  .o-studio-pied { position:relative; display:flex; flex-direction:column; gap:10px; padding:12px 16px 14px; border-top:1px solid var(--filet-carte); border-radius:0 0 var(--arrondi-carte) var(--arrondi-carte); background:var(--carte); }
  .o-studio-pied-boutons { display:flex; gap:6px; }
  /* LA TAILLE DTF : le préréglage d'OLDA, la largeur et la hauteur
     imprimées (grises : la taille du fichier), la résolution trop juste. */
  .o-studio-taille { display:flex; flex-direction:column; gap:8px; }
  .o-studio-taille-tete { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .o-studio-taille-tete label { font-size:var(--t-corps); color:var(--encre-1); white-space:nowrap; }
  .o-studio-taille-tete b { font-weight:var(--g-forte); }
  .o-studio-choix { position:relative; min-width:0; display:flex; }
  .o-studio-choix select { min-width:0; max-width:196px; height:32px; padding:0 28px 0 10px; border:1px solid var(--filet-carte); border-radius:var(--arrondi); background:var(--surface); font:inherit; font-size:var(--t-petit); font-weight:var(--g-note); color:var(--encre-1); text-overflow:ellipsis; cursor:pointer; appearance:none; -webkit-appearance:none; }
  .o-studio-choix select:hover { border-color:var(--filet-fort); }
  .o-studio-choix select:focus-visible { outline:none; border-color:var(--filet-fort); box-shadow:var(--anneau); }
  .o-studio-choix .o-studio-ic { position:absolute; right:8px; top:50%; width:14px; height:14px; margin-top:-7px; color:var(--encre-2); pointer-events:none; }
  .o-studio-taille-champs { display:flex; align-items:center; gap:8px; }
  .o-studio-taille-champ { flex:1; min-width:0; display:flex; align-items:center; gap:6px; height:36px; padding:0 10px; border:1px solid var(--filet-carte); border-radius:var(--arrondi); background:var(--surface); font-size:var(--t-petit); color:var(--encre-2); cursor:text; }
  .o-studio-taille-champ:hover { border-color:var(--filet-fort); }
  .o-studio-taille-champ:focus-within { border-color:var(--filet-fort); box-shadow:var(--anneau); }
  .o-studio-taille-champ > span { font-weight:var(--g-forte); }
  .o-studio-taille-champ input { flex:1; min-width:0; width:100%; height:100%; margin:0; padding:0; border:0; background:transparent; font:inherit; font-size:var(--t-corps); font-weight:var(--g-forte); font-variant-numeric:tabular-nums; color:var(--encre-1); text-align:right; }
  .o-studio-taille-champ input:focus { outline:none; }
  .o-studio-taille-champ input.o-studio-auto { font-weight:var(--g-texte); color:var(--encre-2); }
  .o-studio-taille-fois { font-size:var(--t-petit); color:var(--encre-3); }
  .o-studio-taille-note { display:flex; align-items:center; gap:6px; font-size:var(--t-petit); color:var(--encre-2); }
  .o-studio-taille-note[hidden] { display:none; }
  .o-studio-taille-note::before { content:''; flex:none; width:6px; height:6px; border-radius:50%; background:#d97706; }
  .o-studio-telecharger { flex:1; min-width:0; min-height:48px; border-radius:var(--arrondi); white-space:nowrap; }
  /* Le mot ne passe jamais à la ligne : faute de place, il se coupe. */
  .o-studio-telecharger [data-r="enregistrer-mot"] { min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .o-studio-telecharger .o-studio-ic-dl { display:flex; }
  .o-studio-telecharger .o-studio-ic-ok, .o-studio-telecharger.o-studio-fait .o-studio-ic-dl { display:none; }
  .o-studio-telecharger.o-studio-fait .o-studio-ic-ok { display:flex; }
  .o-studio-telecharger.o-studio-fait, .o-studio-telecharger.o-studio-fait:hover:not(:disabled) { background:var(--succes); border-color:var(--succes); }
  .o-studio-disquette { min-height:48px; min-width:48px; padding:0 12px; border-radius:var(--arrondi); justify-content:center; }
  .o-studio-disquette .o-studio-ic { width:18px; height:18px; }
  .o-studio-disquette.o-studio-fait, .o-studio-disquette.o-studio-fait:hover:not(:disabled) { background:var(--succes); border-color:var(--succes); color:#fff; }
  .o-studio-plus { min-height:48px; padding:0 10px 0 12px; border-radius:var(--arrondi); gap:4px; }
  .o-studio-plus .o-studio-ic { width:16px; height:16px; color:var(--encre-2); transition:transform .15s; }
  .o-studio-plus[aria-expanded="true"] { border-color:var(--filet-fort); background:var(--zone); }
  .o-studio-plus[aria-expanded="true"] .o-studio-ic { transform:rotate(180deg); }
  /* LE MENU « PLUS », ouvert au-dessus du pied : les autres formats. */
  .o-studio-menu { position:absolute; z-index:20; right:16px; bottom:calc(100% - 6px); width:268px; box-sizing:border-box; display:flex; flex-direction:column; padding:6px; border-radius:var(--arrondi-carte); background:var(--surface); border:1px solid var(--filet-carte); box-shadow:var(--ombre-flottant); }
  .o-studio-menu-titre { padding:6px 10px 4px; font-size:var(--t-petit); font-weight:var(--g-forte); color:var(--encre-2); }
  .o-studio-article { display:flex; align-items:center; gap:8px; width:100%; min-height:34px; padding:0 10px; border:0; border-radius:var(--arrondi); background:transparent; color:var(--encre-1); font:inherit; font-size:var(--t-corps); text-align:left; cursor:pointer; }
  .o-studio-article:hover:not(:disabled) { background:var(--zone); }
  .o-studio-article:disabled { opacity:.4; cursor:default; }
  .o-studio-article-mot { font-weight:var(--g-forte); white-space:nowrap; }
  .o-studio-article small { margin-left:auto; font-size:var(--t-petit); color:var(--encre-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Écran étroit (une tablette en portrait) : le panneau passe sous le
     plan, à sa hauteur entière — la page défile, la barre reste en haut,
     pleine largeur. */
  @media (max-width: 1100px) {
    .o-studio-barre { position:sticky; top:0; }
    .o-studio { grid-template-columns:minmax(0,1fr); min-height:0; flex:none; }
    .o-studio-scene { min-height:62vh; }
    .o-studio-defile, .o-studio-inspecteur { flex:none; overflow:visible; }
    .o-studio-insp-tete { position:static; }
  }

  /* LA PAGE : le studio seul, à la hauteur de la fenêtre ; sous 1 100 px,
     le panneau passe sous le plan et la page défile. */
  html, body { height:100%; }
  body { margin:0; background:var(--fond); font-family:var(--police); font-size:var(--t-corps); font-weight:var(--g-texte); line-height:var(--l-texte); color:var(--encre-1); -webkit-font-smoothing:antialiased; }
  b, strong { font-weight:var(--g-forte); }
  small { font-size:var(--t-petit); }
  h2, h3 { font-size:var(--t-titre); font-weight:var(--g-forte); }
  .page { box-sizing:border-box; height:100%; display:flex; flex-direction:column; padding:20px; }
  @media (max-width: 1100px) { .page { height:auto; min-height:100%; } }


  /* COMME « ANALYSER » DANS LE BAT (20 novembre 2026, Charlie : « le logo
     maker qui s'ouvre dans le BAT doit être la référence ») : plein écran
     sombre, la barre en haut, le plan au centre — la presse 500 × 600 mm,
     sa laize de 430 mm et sa règle (lib/studio-detourage.js,
     `dessinerPresse`) —, le panneau à droite, ses titres en petites
     capitales, ses choix en puces. */
  .page { padding:0; }
  .o-studio { gap:0; grid-template-columns:minmax(0,1fr) 340px; }
  .o-studio-scene { border:0; border-radius:0; background:radial-gradient(120% 90% at 40% 45%, #1c1d21 0%, #0e0f11 70%); }
  .o-studio-accueil { background:transparent; }
  .o-studio-accueil-carte { border-color:rgba(255,255,255,.16); background:rgba(23,24,27,.94); }
  .o-studio-panneau { border:0; border-left:1px solid var(--filet-carte); border-radius:0; background:var(--carte); }
  .o-studio-defile { padding:0 4px; }
  .o-studio-bloc { gap:12px; padding:18px 20px; }
  .o-studio-bloc-tete b, .o-studio-insp-bloc .o-studio-bloc-tete b { font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:var(--g-note); color:var(--encre-3); }
  .o-studio-pied { padding:16px 20px 18px; border-radius:0; background:var(--carte); }
  .o-studio-ligne-ic { background:rgba(255,255,255,.06); }
  .o-studio-bouton { border-color:rgba(255,255,255,.12); background:rgba(255,255,255,.04); }
  .o-studio-bouton:hover:not(:disabled) { border-color:rgba(255,255,255,.24); background:rgba(255,255,255,.09); }
  /* Le bouton qui compte : clair sur le sombre, comme la puce choisie. */
  .o-studio-plein, .o-studio-plein:hover:not(:disabled) { background:#f4f4f2; border-color:#f4f4f2; color:#111214; }
  .o-studio-plein:hover:not(:disabled) { background:#fff; border-color:#fff; }
  [data-r="pop-lasso"] .o-studio-bouton.o-studio-plein, [data-r="pop-lasso"] .o-studio-bouton.o-studio-plein .o-studio-ic { color:#111214; }
  .o-studio-telecharger.o-studio-fait, .o-studio-telecharger.o-studio-fait:hover:not(:disabled) { color:#fff; }
  /* LES PUCES (les segments) : chacune son filet ; la choisie, claire. */
  .o-studio-segment { display:flex; flex-wrap:wrap; gap:6px; padding:0; border:0; background:transparent; }
  .o-studio-segment > button, .o-studio-segment > label { flex:1 0 auto; display:inline-flex; align-items:center; justify-content:center; gap:7px; height:36px; padding:0 12px; box-sizing:border-box; border:1px solid rgba(255,255,255,.12); border-radius:8px; background:transparent; color:var(--encre-1); font:inherit; font-size:13px; font-weight:var(--g-note); white-space:nowrap; cursor:pointer; box-shadow:none; transition:background .12s, border-color .12s, color .12s; }
  .o-studio-segment > button:hover, .o-studio-segment > label:hover { color:var(--encre-1); border-color:rgba(255,255,255,.28); }
  .o-studio-segment > button[aria-checked="true"], .o-studio-segment > label[aria-checked="true"], .o-studio-segment > button[aria-checked="true"]:hover, .o-studio-segment > label[aria-checked="true"]:hover { background:#f4f4f2; border-color:#f4f4f2; color:#111214; box-shadow:none; }
  .o-studio-segment > [aria-checked="true"] .o-studio-ic, .o-studio-segment > button[aria-checked="true"] .o-studio-ic { color:#3063e9; }
  .o-studio-segment .o-studio-pastille { width:12px; height:12px; }
  .o-studio-segment > label { position:relative; }
  .o-studio-segment input[type=color] { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border:0; opacity:0; cursor:pointer; }
  /* LA COULEUR EN MENU DÉROULANT : la couleur choisie, un chevron ; ouvert,
     les teintes du logo et le nuancier. */
  .o-studio-deroulant > summary { display:flex; align-items:center; gap:10px; min-height:44px; padding:0 14px; border:1px solid rgba(255,255,255,.12); border-radius:10px; background:rgba(255,255,255,.04); list-style:none; cursor:pointer; font-size:14px; font-weight:var(--g-note); color:var(--encre-1); }
  .o-studio-deroulant > summary::-webkit-details-marker { display:none; }
  .o-studio-deroulant > summary:hover { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.22); }
  .o-studio-deroulant > summary:focus-visible { outline:none; box-shadow:var(--anneau); }
  .o-studio-deroulant > summary > span { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .o-studio-deroulant-pastille { flex:none; width:18px; height:18px; border-radius:50%; background:conic-gradient(#e4032c, #ffeb00, #3aaa35, #00adba, #004f9f, #d2c5e2, #e4032c); box-shadow:inset 0 0 0 1px rgba(255,255,255,.25); }
  .o-studio-chevron { width:7px; height:7px; margin:0 2px 3px; border-right:1.5px solid var(--encre-2); border-bottom:1.5px solid var(--encre-2); rotate:45deg; }
  .o-studio-deroulant[open] .o-studio-chevron { rotate:225deg; margin-bottom:-3px; }
  .o-studio-deroulant-corps { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  /* LE CHARGEMENT : la barre seule, comme l'enregistrement du BAT — un
     surtitre, un grand pourcentage, une barre ; un échec y reste. */
  .o-studio-prep { left:50%; top:50%; bottom:auto; width:min(380px, calc(100% - 32px)); transform:translate(-50%, -50%); padding:22px 24px 24px; border:0; border-radius:16px; background:rgba(23,24,27,.94); -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 0 0 1px rgba(255,255,255,.1), 0 24px 60px rgba(0,0,0,.55); }
  .o-studio-charge-tete { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .o-studio-charge-sur { margin:0; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--encre-3); font-weight:var(--g-note); }
  .o-studio-charge-titre { margin:4px 0 0; font-size:var(--t-titre); font-weight:var(--g-forte); color:var(--encre-1); }
  .o-studio-charge-chiffre { display:flex; align-items:baseline; gap:2px; margin:14px 0 12px; color:var(--encre-1); font-variant-numeric:tabular-nums; }
  .o-studio-charge-chiffre b { font-size:64px; line-height:.9; font-weight:var(--g-forte); letter-spacing:-.045em; }
  .o-studio-charge-chiffre span { font-size:24px; color:var(--encre-3); }
  .o-studio-charge-barre { height:6px; border-radius:var(--pilule); background:rgba(255,255,255,.08); overflow:hidden; }
  .o-studio-charge-barre i { display:block; height:100%; border-radius:inherit; background:#f4f4f2; transition:width .3s ease-out; }
  .o-studio-prep[data-echec] .o-studio-charge-barre i { background:var(--danger); }
  .o-studio-charge-erreur { margin:14px 0 0; font-size:var(--t-petit); line-height:var(--l-texte); color:var(--danger); }

  /* RETOUCHER LE LOGO : Logo maker sur toute la largeur, ChatGPT, Fiverr —
     les tuiles du BAT. */
  .o-studio-outils { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .o-studio-outil-tuile { display:flex; align-items:center; gap:10px; min-height:48px; padding:10px 12px; box-sizing:border-box; text-align:left; text-decoration:none; border:1px solid rgba(255,255,255,.1); border-radius:12px; background:rgba(255,255,255,.04); color:var(--encre-1); font:inherit; cursor:pointer; transition:background .12s, border-color .12s, transform .12s; }
  .o-studio-outil-tuile:hover { background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.22); }
  .o-studio-outil-tuile:active { transform:scale(.98); }
  .o-studio-outil-tuile:focus-visible { outline:2px solid #6f95ff; outline-offset:1px; }
  .o-studio-outil-tuile[inert] { opacity:.4; }
  .o-studio-outil-tuile > svg, .o-studio-outil-f { flex:none; width:22px; height:22px; color:var(--encre-1); }
  .o-studio-outil-f { display:grid; place-items:center; border-radius:6px; background:#1dbf73; color:#fff; font-style:normal; font-weight:800; font-size:12px; letter-spacing:-.02em; }
  .o-studio-outil-tuile b { font-size:13px; font-weight:var(--g-forte); line-height:1.25; }
  .o-studio-outil-lm { grid-column:1 / -1; background:rgba(111,149,255,.12); border-color:rgba(111,149,255,.3); }
  .o-studio-reglages[hidden] { display:none !important; }
  /* Les puces du fond : chacune à sa largeur, comme le BAT. */
  .o-studio-puces > button, .o-studio-puces > label { flex:0 0 auto; }
  .o-studio-deroulant-corps .o-studio-segment > button { flex:0 0 auto; }
  /* La taille DTF, en tête du menu « Plus ». */
  .o-studio-menu .o-studio-taille { padding:8px 10px 12px; margin-bottom:4px; border-bottom:1px solid var(--filet-carte); }
  .o-studio-menu { width:300px; }

</style>
</head>
